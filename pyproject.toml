# Версия модуля. Единственный источник — app/__init__.py:__version__; здесь
# номер дублируется, потому что pyproject не умеет его читать без системы сборки.
# Расхождение двух номеров ловит tests/test_version.py.
# Правила нумерации и история изменений — CHANGELOG.md.
[project]
name = "anonymization-service"
version = "1.0.1"
description = "Микросервис обезличивания персональных данных в русскоязычных текстах"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Маркеры = категории для меню прогона (scripts/test_menu.py) и для CI.
# Разложены по ЦЕЛИ тестирования (ось 4 методики) и по УРОВНЮ (ось 3) —
# см. tests/МЕТОДИКА_ТЕСТИРОВАНИЯ.md. Один тест может иметь несколько маркеров.
markers = [
    "requires_model: тест требует дообученную PERSON-модель (ruBERT); в CI без модели пропускается через -m 'not requires_model'",
    "security: безопасность — аутентификация, границы политики сущностей, отсутствие ПДн в выдаче ошибок",
    "privacy: приватность — гейт LeakRate: 0 утечек ПДн на held-out наборе",
    "speed: скорость — латентность и пропускная способность обработки",
    "unit: модульные — распознавание каждого типа ПДн изолированно",
    "integration: интеграционные — HTTP API и адаптер Chatwoot",
    "e2e: сквозные — вся цепочка целиком, включая обратимость по mapping",
    "custom_params: кастомный параметр disable_entities (сужение анонимизации по запросу)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# GramLynx — вендоренный отдельный сервис (свой app/, свой .venv), не код модуля.
extend-exclude = ["tests/GramLynx"]

[tool.ruff.lint]
# Базовый набор: ошибки (E,F), баги (B), импорты (I). Без вкусовщины.
select = ["E", "F", "B", "I"]
ignore = [
    "E501",  # длину строк не блокируем жёстко
    "B008",  # Depends() в дефолтах аргументов — идиома FastAPI, не ошибка
    "B905",  # zip() без strict= — стилевая мелочь
]
