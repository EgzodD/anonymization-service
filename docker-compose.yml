services:
  # Сервис `db` нужен ТОЛЬКО в режиме интеграции с Chatwoot (CHATWOOT_ENABLED=true).
  # В standalone-режиме (по умолчанию) он не используется — раскомментируйте
  # вместе с `depends_on` у anonymizer, если включаете интеграцию.
  # Порт 5432 наружу НЕ публикуем (дыра в периметре) — доступ только из сети compose.
  # db:
  #   image: postgres:16-alpine
  #   env_file: .env
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  anonymizer:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Путь к модели ВНУТРИ контейнера (переопределяет хостовый путь из .env).
      # models/person_ruBERT копируется в образ отдельным COPY (см. Dockerfile).
      - PERSON_MODEL_DIR=/app/models/person_ruBERT
    # depends_on нужен только при CHATWOOT_ENABLED=true (раскомментируйте вместе с `db`).
    # depends_on:
    #   db:
    #     condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
