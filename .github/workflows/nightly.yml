# CI — контур 2: тяжёлые проверки по расписанию (не на каждый коммит).
# Здесь живёт то, что медленно/шумно для per-commit: полный прогон, метрики
# качества NER, нагрузочное. Формат-близнец в .github/workflows/.

name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"   # каждую ночь в 02:00 UTC
  workflow_dispatch: {}    # + запуск вручную из интерфейса

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          # Именно requirements-dev.txt: он тянет requirements.txt плюс reportlab
          # и pytest-cov. Без reportlab шесть тестов PDF-адаптера молча уходили в
          # skip по importorskip — «полный прогон» был менее полным, чем быстрый
          # контур в ci.yml, который dev-зависимости ставит.
          pip install -r requirements-dev.txt
          python -m spacy download ru_core_news_lg

      # Полный прогон набора. Если модель подключена (см. privacy-gate в ci.yml) —
      # сюда же встанет requires_model; без модели требующие её тесты пропустятся.
      - name: Полный прогон тестов
        env:
          # Модели PERSON в чекауте нет, а без неё сервис намеренно не стартует.
          # Тесты это и так учитывают (conftest), но флаг ставим явно — как в ci.yml,
          # чтобы два контура отличались только составом тестов, а не окружением.
          ALLOW_NO_PERSON_MODEL: "true"
        run: pytest -q --cov=app --cov-report=term-missing

      # TODO (когда будет модель-артефакт и стенд):
      #  - Полные метрики качества NER на held-out (precision/recall/F2).
      #  - Нагрузочное: локально поднять сервис + прогнать locust/k6, снять латентность/throughput.
